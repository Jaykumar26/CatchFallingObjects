// Top-level build file
buildscript {
    repositories {
        google()
        mavenCentral()
    }
    dependencies {
        classpath 'com.android.tools.build:gradle:9.1.1'
    }
}

plugins {
    id 'com.android.application' version '9.1.1' apply false
}

task clean(type: Delete) {
    delete rootProject.buildDir
}
